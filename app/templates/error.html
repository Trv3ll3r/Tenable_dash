<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Tenable Dashboard</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-shield-alt"></i> Tenable One Dashboard
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h4><i class="fas fa-exclamation-triangle"></i> Application Error</h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-danger">
                            <strong>Error:</strong> {{ error }}
                        </div>
                        
                        <h5>Possible Solutions:</h5>
                        <ul>
                            <li>Check that all required files are present</li>
                            <li>Verify your .env configuration</li>
                            <li>Ensure database permissions are correct</li>
                            <li>Try refreshing the page</li>
                        </ul>
                        
                        <div class="mt-3">
                            <a href="/" class="btn btn-primary">
                                <i class="fas fa-home"></i> Return to Dashboard
                            </a>
                            <a href="/api/test_connection" class="btn btn-info">
                                <i class="fas fa-diagnostic"></i> Test Connection
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
